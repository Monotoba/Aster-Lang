[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-lang"
version = "0.1.2"
description = "A human-first programming language with an interpreter, compiler, VM, formatter, and LSP"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "R Morgan" }
]
keywords = [
  "compiler",
  "interpreter",
  "language-server",
  "programming-language",
  "virtual-machine",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Monotoba/Aster-Lang"
Documentation = "https://github.com/Monotoba/Aster-Lang/tree/main/docs"
Repository = "https://github.com/Monotoba/Aster-Lang"
Issues = "https://github.com/Monotoba/Aster-Lang/issues"

[project.optional-dependencies]
dev = [
  "lsprotocol>=2025.0.0",
  "pygls>=2.0",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
lsp = [
  "lsprotocol>=2025.0.0",
  "pygls>=2.0",
]

[project.scripts]
aster = "aster_lang.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aster_lang = ["stdlib/*.aster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
packages = ["aster_lang"]

[[tool.mypy.overrides]]
# native_modules.py uses lazy runtime imports to avoid circular dependencies;
# the resulting attribute access patterns are not amenable to static typing.
module = "aster_lang.native_modules"
ignore_errors = true

[[tool.mypy.overrides]]
# Test files use pytest decorators (e.g. skipif marks) that mypy cannot type
# through cleanly; suppress warn_unused_ignores so type: ignore comments work
# consistently across both standalone and pre-commit mypy invocations.
module = "tests.*"
warn_unused_ignores = false
